name: Sync Obsidian posts

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
          contents: write
    steps:
      - name: Checkout Hugo site
        uses: actions/checkout@v6

      - name: Checkout Obsidian vault
        uses: actions/checkout@v6
        with:
          repository: dylanCz/obsidian
          token: ${{ secrets.OBSIDIAN_PAT }}
          path: vault

      - name: Sync Obsidian posts to Hugo
        run: |
          #!/bin/bash
          set -euo pipefail

          VAULT_DIR="vault"
          POSTS_DIR="content/posts"
          ATTACHMENTS_DIR="static/attachments"

          # Clean and recreate output directories
          rm -rf "$POSTS_DIR" "$ATTACHMENTS_DIR"
          mkdir -p "$POSTS_DIR" "$ATTACHMENTS_DIR"

          # Copy markdown files flagged with publish: "true"
          while IFS= read -r f; do
            if awk '/^---/{n++} n==1' "$f" | grep -q '^publish: "true"'; then
              cp "$f" "$POSTS_DIR/" && echo "Copied: $f"
            else
              echo "Skipped: $f"
            fi
          done < <(find "$VAULT_DIR" -name "*.md")

          # Copy attachments prefixed with publish_ from any attachments/ subfolder
          find "$VAULT_DIR" -type d -name "attachments" -exec find {} -maxdepth 1 -name "publish_*" \; | \
            while IFS= read -r f; do
              cp "$f" "$ATTACHMENTS_DIR/" && echo "Copied attachment: $(basename "$f")"
            done

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add content/posts/
          git diff --staged --quiet || git commit -m "Sync posts from Obsidian"
          git push
