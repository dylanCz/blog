name: Sync Obsidian posts

on:
  schedule:
    - cron: '0 * * * *'  # every hour
  workflow_dispatch:       # manual trigger too

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
          contents: write
    steps:
      - name: Checkout Hugo site
        uses: actions/checkout@v4

      - name: Checkout Obsidian vault
        uses: actions/checkout@v4
        with:
          repository: dylanCz/obsidian
          token: ${{ secrets.OBSIDIAN_PAT }}
          path: vault

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run sync script
        run: |
          go mod tidy
          go run sync.go

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add content/posts/
          git diff --staged --quiet || git commit -m "Sync posts from Obsidian"
          git push
